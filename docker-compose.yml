services:
  blog:
    # build: .
    image: volla12345/blogg:sidekiq
    ports:
      - "80:80"
    env_file:
      - app/.env
    depends_on:
      - db
    volumes:
      - rails_storage:/rails/storage

  db:
    image: postgres:16
    env_file:
      - app/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sidekiq:
    image: volla12345/blogg:sidekiq
    command: bundle exec sidekiq
    env_file:
      - app/.env
    depends_on:
      - db
      - redis
    volumes:
      - rails_storage:/rails/storage

  redis:
    image: redis:7.2
  
volumes:
  rails_storage:
  postgres_data:
