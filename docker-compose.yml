services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - rails_storage:/app/storage

  frontend:
    build: ./frontend
    ports:
      - "3001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:16
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sidekiq:
    build: ./backend
    command: bundle exec sidekiq
    env_file:
      - backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - rails_storage:/rails/storage

  redis:
    image: redis:7.2
  
volumes:
  rails_storage:
  postgres_data: